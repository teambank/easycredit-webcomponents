name: Release

on:
  push:
    tag:
    - '*'

jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - name: Run script file
      id: build-release
      run: |
         npm ci
         npm run release

         VERSION=$(npm pkg get version | sed 's/"//g')
         echo "version=$VERSION" >> "$GITHUB_OUTPUT"
         echo "filepath=easycredit-webcomponents-$VERSION.tar.gz" >> "$GITHUB_OUTPUT"
         echo "filename=easycredit-webcomponents-$VERSION.tar.gz" >> "$GITHUB_OUTPUT"
         echo "hydrate_filepath=easycredit-webcomponents-hydrate-$VERSION.tar.gz" >> "$GITHUB_OUTPUT"
         echo "hydrate_filename=easycredit-webcomponents-hydrate-$VERSION.tar.gz" >> "$GITHUB_OUTPUT"
      shell: bash
    - name: Create Release
      id: create-release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: v${{ github.ref }}
        body: "For a detailed overview of changes, please check out our [Changelog](https://netzkollektiv.com/docs/easycredit-ratenkauf-components/?path=/docs/getting-started-changelog--docs)"
        draft: true
        prerelease: false
    - name: Upload Release Asset
      id: upload-release-asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create-release.outputs.upload_url }}
        asset_path: ${{ steps.build-release.outputs.filepath }}
        asset_name: ${{ steps.build-release.outputs.filename }}
        asset_content_type: application/gzip
    - name: Upload Hydrate Release Asset
      id: upload-hydrate-release-asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create-release.outputs.upload_url }}
        asset_path: ${{ steps.build-release.outputs.hydrate_filepath }}
        asset_name: ${{ steps.build-release.outputs.hydrate_filename }}
        asset_content_type: application/gzip

  deploy-storybook:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: npm
    - run: npm ci
    - run: npm run build
    - run: npm run storybook:build
    - name: Install lftp
      run: sudo apt-get update && sudo apt-get install -y lftp
    - name: Deploy Storybook
      env:
        STORYBOOK_DEPLOY_DST: ${{ secrets.STORYBOOK_DEPLOY_DST }}
        STORYBOOK_DEPLOY_SSH_KEY: ${{ secrets.STORYBOOK_DEPLOY_SSH_KEY }}
      run: bash scripts/deploy-storybook.sh
